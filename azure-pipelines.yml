trigger:
  - master

pr: none

resources:
  - repo: self

variables:
  - group: public-npm
  - group: public-nuget
  - name: restore-projects
    value: "**/*.csproj"
  - name: test-projects
    value: "**/*[Tt]ests/*.csproj"
  - name: testResultsDirectory
    value: "$(Agent.TempDirectory)/TestResults"
  - name: buildPlatform
    value: "Any CPU"
  - name: buildConfiguration
    value: "Release"
  - name: envName
    value: "brandup-website"
  - name: version-major
    value: "10"
  - name: version-minor
    value: "0"

name: $(version-major).$(version-minor).$(rev:r)

pool:
  name: Test

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: BuildNet
        displayName: Build NET
        pool:
          name: Test
          workspace:
            clean: all
        steps:
          - script: |
              echo "Hello, world!"
              echo "build number - $(Build.BuildNumber)"
            displayName: "print variables"

          - checkout: self
            fetchDepth: 1
            clean: "true"
            persistCredentials: "true"

          - task: UseDotNet@2
            displayName: "use dotnet 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"

          # Sources come from the repository's nuget.config (nuget.org only), the same ones a local restore uses.
          - task: DotNetCoreCLI@2
            displayName: "dotnet restore"
            inputs:
              command: "restore"
              projects: $(restore-projects)
              feedsToUse: "config"
              nugetConfigPath: "nuget.config"

          - task: DotNetCoreCLI@2
            displayName: "dotnet build"
            inputs:
              command: "build"
              projects: $(restore-projects)
              arguments: --configuration $(buildConfiguration) /p:Version=$(Build.BuildNumber)

          # Tests run on Microsoft.Testing.Platform (see global.json), which writes its own trx/cobertura
          # reports, so publishTestResults must stay off to keep the task from injecting VSTest options
          # that the platform does not understand. --report-trx and --coverage come from the
          # Microsoft.Testing extensions referenced by the test project.
          - task: DotNetCoreCLI@2
            displayName: "dotnet test"
            inputs:
              command: test
              projects: $(test-projects)
              arguments: >
                --configuration $(buildConfiguration) --no-build --no-restore
                --results-directory "$(testResultsDirectory)"
                --report-trx
                --coverage --coverage-output-format cobertura
              publishTestResults: false

          - task: PublishTestResults@2
            displayName: "publish test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "*.trx"
              searchFolder: $(testResultsDirectory)
              testRunTitle: "solution tests"
              mergeTestResults: true
              failTaskOnFailedTests: true

          # Only the top level: the same reports are duplicated under In/<machine>/, and a ** pattern
          # would count every file twice.
          - task: PublishCodeCoverageResults@2
            displayName: "publish code coverage"
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "$(testResultsDirectory)/*.cobertura.xml"
              pathToSources: $(Build.SourcesDirectory)
              failIfCoverageEmpty: true

          - task: DotNetCoreCLI@2
            displayName: "dotnet pack"
            inputs:
              command: "custom"
              projects: "src/*/*.csproj"
              custom: "pack"
              arguments: '--configuration $(buildConfiguration) --output "$(Build.ArtifactStagingDirectory)" /p:Version=$(Build.BuildNumber)'

          - publish: $(build.artifactstagingdirectory)
            displayName: publish artifact
            condition: succeededOrFailed()
            artifact: net

      - job: BuildNpm
        displayName: Build NPM
        dependsOn: [BuildNet]
        pool:
          name: Test
          workspace:
            clean: all
        steps:
          - script: |
              echo "Hello, world!"
              echo "build number - $(Build.BuildNumber)"
            displayName: "print variables"

          - checkout: self
            fetchDepth: 1
            clean: "true"
            persistCredentials: "true"

          - task: UseNode@1
            displayName: "use node 24.x"
            inputs:
              version: "24.18.0"

          - script: npm run i
            displayName: "npm install"

          - script: npm run build
            displayName: "packages npm build"

          # test:ci adds --coverage and the jest-junit reporter; both report paths are configured in
          # package.json / jest.config.js and are consumed by the two tasks below.
          - script: npm run test:ci
            displayName: "packages npm test"

          - task: PublishTestResults@2
            displayName: "publish npm test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "junit.xml"
              searchFolder: $(Build.SourcesDirectory)/TestResults
              testRunTitle: "npm tests"
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: "publish npm code coverage"
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "$(Build.SourcesDirectory)/coverage/cobertura-coverage.xml"
              pathToSources: $(Build.SourcesDirectory)
              failIfCoverageEmpty: true

          - script: npm run npm:version $(Build.BuildNumber)
            displayName: "packages npm version"

          - script: npm run npm:cleanup
            displayName: "packages npm cleanup"

          - script: npm run npm:pack --pack-destination "$(Build.ArtifactStagingDirectory)"
            displayName: "packages npm pack"

          - publish: $(build.artifactstagingdirectory)
            displayName: publish artifact
            condition: succeededOrFailed()
            artifact: npm

  - stage: Production
    displayName: Deploy stage
    dependsOn: Build
    jobs:
      - deployment: Production
        condition: succeeded()
        displayName: Production
        pool:
          name: Test
        environment: $(envName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: ExtractFiles@1
                  displayName: "unzip brandup-ui-website"
                  inputs:
                    archiveFilePatterns: "$(Pipeline.Workspace)/npm/brandup-ui-website-$(Build.BuildNumber).tgz"
                    destinationFolder: "$(Pipeline.Workspace)/npm/brandup-ui-website"
                    cleanDestinationFolder: true
                    overwriteExistingFiles: true

                - task: UseNode@1
                  displayName: "use node 24.x"
                  inputs:
                    version: "24.18.0"

                # npmAuthenticate adds the token of the service connection to this file.
                - script: echo registry=https://registry.npmjs.org/> "$(Pipeline.Workspace)/.npmrc"
                  displayName: "create .npmrc"

                - task: npmAuthenticate@0
                  displayName: "npm authenticate"
                  inputs:
                    workingFile: "$(Pipeline.Workspace)/.npmrc"
                    customEndpoint: "$(publish-npm-credentials)"

                - script: npm publish --userconfig "$(Pipeline.Workspace)/.npmrc"
                  displayName: "publish npm brandup-ui-website"
                  workingDirectory: "$(Pipeline.Workspace)/npm/brandup-ui-website/package"

                - task: UseDotNet@2
                  displayName: "use dotnet 10.x"
                  inputs:
                    packageType: "sdk"
                    version: "10.x"

                - task: DotNetCoreCLI@2
                  displayName: "publish nuget"
                  inputs:
                    command: custom
                    custom: nuget
                    arguments: >
                      push "$(Pipeline.Workspace)/net/*.nupkg"
                      -s $(nuget-api-url)
                      -k $(nuget-api-key)

      - job: GitTag
        displayName: Add git tag
        dependsOn: [Production]
        condition: succeeded()
        steps:
          - checkout: self
            fetchDepth: 1
            clean: "true"
            persistCredentials: "true"

          - script: |
              echo Tagging $(Build.Repository.Name) with $(Build.BuildNumber)
              git config user.name "AzureDevOps Agent"
              git tag "$(Build.BuildNumber)" --force
              git push origin "$(Build.BuildNumber)" --force
            displayName: set git tag
